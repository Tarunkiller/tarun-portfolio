function NetworkCanvas(){
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    const ctx = canvas.getContext('2d');
    let raf, w, h;
    const N = 46;
    const pts = Array.from({length:N}, () => ({
      x: Math.random(), y: Math.random(),
      vx: (Math.random()-0.5)*0.0006, vy: (Math.random()-0.5)*0.0006,
    }));
    function resize(){
      w = canvas.parentElement.clientWidth; h = canvas.parentElement.clientHeight;
      canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);
    }
    resize();
    window.addEventListener('resize', resize);
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function frame(){
      ctx.clearRect(0,0,w,h);
      pts.forEach(p => {
        if(!reduceMotion){
          p.x += p.vx; p.y += p.vy;
          if(p.x<0||p.x>1) p.vx*=-1;
          if(p.y<0||p.y>1) p.vy*=-1;
        }
      });
      for(let i=0;i<N;i++){
        for(let j=i+1;j<N;j++){
          const a=pts[i], b=pts[j];
          const dx=(a.x-b.x)*w, dy=(a.y-b.y)*h;
          const d = Math.sqrt(dx*dx+dy*dy);
          if(d < 130){
            ctx.strokeStyle = `rgba(94,230,200,${0.14*(1-d/130)})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x*w,a.y*h); ctx.lineTo(b.x*w,b.y*h); ctx.stroke();
          }
        }
      }
      pts.forEach(p => {
        ctx.fillStyle = 'rgba(124,140,255,0.7)';
        ctx.beginPath(); ctx.arc(p.x*w, p.y*h, 1.6, 0, Math.PI*2); ctx.fill();
      });
      raf = requestAnimationFrame(frame);
    }
    frame();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={ref}></canvas>;
}

function useReveal(){
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}
